<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interface para cadastro, consulta, edição e exclusão de produtos"
    />
    <title>Gestão de produtos</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="cabecalho">
        <div>
          <p class="etiqueta">Projeto Integrador VI</p>
          <h1>Gestão de produtos</h1>
          <p class="subtitulo">CRUD completo com Node.js, Sequelize e SQLite.</p>
        </div>
        <span class="status">Banco relacional</span>
      </header>

      <section class="cartao" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario">Novo produto</h2>
        <form id="produto-form">
          <input id="produto-id" type="hidden" />
          <label>
            Nome
            <input
              id="nome"
              name="nome"
              type="text"
              minlength="2"
              maxlength="120"
              required
              placeholder="Ex.: Teclado mecânico"
            />
          </label>
          <label>
            Preço
            <input
              id="preco"
              name="preco"
              type="number"
              min="0"
              step="0.01"
              required
              placeholder="0,00"
            />
          </label>
          <div class="acoes-formulario">
            <button id="salvar" type="submit">Salvar produto</button>
            <button id="cancelar" class="secundario oculto" type="button">
              Cancelar edição
            </button>
          </div>
        </form>
      </section>

      <section class="cartao" aria-labelledby="titulo-lista">
        <div class="titulo-lista">
          <h2 id="titulo-lista">Produtos cadastrados</h2>
          <button id="recarregar" class="secundario" type="button">Atualizar lista</button>
        </div>
        <p id="mensagem" role="status" aria-live="polite"></p>
        <div class="tabela-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Preço</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="produtos"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
